[project]
name = "medea-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "numpy>=1.24.0",
    "h5py>=3.0.0",
    "requests>=2.32.0",
    "nltk>=3.9.0",
    "tqdm>=4.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
