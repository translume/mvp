[project]
name = "translume-workspace"
version = "0.1.0"
description = "Translume MVP modular workspace"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
api = ["fastapi>=0.115.0", "uvicorn>=0.32.0"]
ui = ["gradio>=6.0.0,<7.0.0", "plotly>=6.0.0", "reportlab==5.0.0"]
http = ["httpx>=0.27.0"]
schemas = ["pydantic>=2.9.0"]
postgres = ["psycopg[binary]>=3.3.0"]
docling = ["docling>=2.102.2"]
graph = ["polars>=1.0.0"]

[tool.uv.workspace]
members = [
    "apps/translume-api",
    "apps/translume-ui",
    "packages/translume-schemas",
    "packages/translume-ports",
    "packages/translume-core",
    "packages/translume-clients",
    "packages/translume-adapters",
    "services/docling-service",
    "services/optimuskg-service",
    "services/tooluniverse-service",
    "services/medea-service",
    "services/worker",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
