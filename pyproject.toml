[project]
name = "translume-workspace"
version = "0.1.0"
description = "Translume MVP modular workspace"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
runtime = [
    "pydantic==2.14.3",
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "httpx[socks]==0.28.1",
    "pymupdf==1.27.2.3",
    "python-multipart==0.0.33",
    "psycopg[binary]==3.3.8",
    "gradio==6.31.0",
    "plotly==6.8.0",
    "reportlab==5.0.0",
    "polars==1.41.2",
    "pyarrow==26.0.1",
    "networkx==3.7",
    "requests==2.34.2",
    "platformdirs==4.10.0",
    "huggingface-hub==2.4.0",
    "numpy==2.5.4",
    "neo4j==6.4.1",
    "openai==2.54.0",
    "pyyaml==6.0.3",
    "h5py==3.16.0",
    "nltk==3.10.4",
    "tqdm==4.70.1",
    "graphql-core==3.3.2",
    "jsonpath-ng==1.16.0",
    "lxml==6.1.3",
    "beautifulsoup4==4.15.0",
    "xmltodict==1.0.4",
    "jsonschema==4.26.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
api = ["fastapi>=0.115.0", "uvicorn>=0.32.0"]
ui = ["gradio>=6.0.0,<7.0.0", "plotly>=6.0.0", "reportlab==5.0.0"]
http = ["httpx>=0.27.0"]
schemas = ["pydantic>=2.9.0"]
postgres = ["psycopg[binary]>=3.3.0"]
document = ["pymupdf==1.27.2.3"]
graph = ["polars>=1.0.0"]

[tool.uv.workspace]
members = [
    "apps/translume-api",
    "apps/translume-ui",
    "packages/translume-schemas",
    "packages/translume-ports",
    "packages/translume-core",
    "packages/translume-clients",
    "packages/translume-adapters",
    "services/docling-service",
    "services/optimuskg-service",
    "services/tooluniverse-service",
    "services/medea-service",
    "services/worker",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
