services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: translume
      POSTGRES_USER: translume
      POSTGRES_PASSWORD: translume
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translume -d translume"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Translume-dev-password-123!
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  vllm-clinical:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    command: >
      ${VLLM_MODEL:?Set VLLM_MODEL to the local/HuggingFace clinical structured-output model id}
      --host 0.0.0.0
      --port 8000
      --structured-outputs-config.backend=auto
    gpus:
      - device_ids: ["0"]
        capabilities: ["gpu"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 60

  vllm-docling:
    image: vllm/vllm-openai:latest
    profiles: ["gpu", "docling"]
    command: >
      ibm-granite/granite-docling-258M
      --revision untied
      --host 0.0.0.0
      --port 8000
      --dtype bfloat16
      --max-model-len 8192
      --max-num-seqs 512
      --max-num-batched-tokens 8192
      --gpu-memory-utilization 0.90
      --enable-chunked-prefill
      --structured-outputs-config.backend=auto
      --limit-mm-per-prompt '{"image":1}'
    gpus:
      - device_ids: ["1"]
        capabilities: ["gpu"]
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 60

  docling-service:
    build:
      context: .
      dockerfile: docker/docling.Dockerfile
    env_file: ${TRANSLUME_ENV_FILE:-.env}
    environment:
      OPENAI_API_KEY: ""
      DOWNSTREAM_OPENAI_API_KEY: ""
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 20

  optimuskg-service:
    build:
      context: .
      dockerfile: docker/optimuskg-service.Dockerfile
    env_file: ${TRANSLUME_ENV_FILE:-.env}
    environment:
      OPENAI_API_KEY: ""
      DOWNSTREAM_OPENAI_API_KEY: ""
      OPTIMUSKG_CACHE_DIR: /app/data/optimuskg_cache
      OPTIMUSKG_USE_LCC: ${OPTIMUSKG_USE_LCC:-true}
      OPTIMUSKG_FORCE_DOWNLOAD: ${OPTIMUSKG_FORCE_DOWNLOAD:-false}
    volumes:
      - "${OPTIMUSKG_CACHE_DIR:-./data/optimuskg_cache}:/app/data/optimuskg_cache"
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 20

  reactome-graphdb:
    image: ${REACTOME_GRAPHDB_IMAGE:-public.ecr.aws/reactome/graphdb:Release97}
    restart: unless-stopped
    expose:
      - "7474"
      - "7687"
    environment:
      NEO4J_dbms_memory_heap_maxSize: ${REACTOME_NEO4J_HEAP_MAX_SIZE:-8g}

  tooluniverse-service:
    build:
      context: .
      dockerfile: docker/tooluniverse-service.Dockerfile
    env_file: ${TRANSLUME_ENV_FILE:-.env}
    environment:
      OPENAI_API_KEY: ""
      DOWNSTREAM_OPENAI_API_KEY: ""
    ports:
      - "8092:8092"
    depends_on:
      reactome-graphdb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

  medea-service:
    build:
      context: .
      dockerfile: docker/medea-service.Dockerfile
    env_file: ${TRANSLUME_ENV_FILE:-.env}
    environment:
      OPENAI_API_KEY: ""
      DOWNSTREAM_OPENAI_API_KEY: ""
      MEDEADB_PATH: /app/data/medea_cache/MedeaDB
      MEDEA_REQUIRE_DATABASE: ${MEDEA_REQUIRE_DATABASE:-true}
      MEDEA_DB_MAX_GENE_PAIRS: ${MEDEA_DB_MAX_GENE_PAIRS:-10}
      MEDEA_DB_SIMILAR_GENES_PER_SINGLE_GENE: ${MEDEA_DB_SIMILAR_GENES_PER_SINGLE_GENE:-3}
    volumes:
      - "${MEDEADB_PATH:-./data/medea_cache/MedeaDB}:/app/data/medea_cache/MedeaDB:ro"
    ports:
      - "8093:8093"
    depends_on:
      vllm-clinical:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8093/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 20

  translume-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: ${TRANSLUME_ENV_FILE:-.env}
    environment:
      # Remote credentials are intentionally scoped to downstream runners.
      OPENAI_API_KEY: ""
      DOWNSTREAM_OPENAI_API_KEY: ""
    ports:
      - "8080:8080"
    volumes:
      - "./third_party:/app/third_party:ro"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      docling-service:
        condition: service_healthy
      optimuskg-service:
        condition: service_healthy
      tooluniverse-service:
        condition: service_healthy
      medea-service:
        condition: service_healthy
      precision-oncology-pipeline:
        condition: service_healthy
      dynamic-pathway-analyzer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 20

  translume-ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    env_file: ${TRANSLUME_ENV_FILE:-.env}
    environment:
      OPENAI_API_KEY: ""
      DOWNSTREAM_OPENAI_API_KEY: ""
      TRANSLUME_API_BASE_URL: http://translume-api:8080
      TRANSLUME_UI_HOST: 0.0.0.0
      TRANSLUME_UI_PORT: 7860
      TRANSLUME_UI_PROCESS_TIMEOUT_SECONDS: 3600
      TRANSLUME_UI_DOWNSTREAM_TIMEOUT_SECONDS: 7200
    ports:
      - "7860:7860"
    depends_on:
      translume-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 20

  translume-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: ${TRANSLUME_ENV_FILE:-.env}
    environment:
      OPENAI_API_KEY: ""
      DOWNSTREAM_OPENAI_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  precision-oncology-pipeline:
    build:
      context: .
      dockerfile: docker/precision-oncology-pipeline.Dockerfile
    environment:
      OPENAI_API_KEY: ${DOWNSTREAM_OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      PRECISION_ONCOLOGY_UID: ${PRECISION_ONCOLOGY_UID:-1000}
      PRECISION_ONCOLOGY_GID: ${PRECISION_ONCOLOGY_GID:-1000}
      PIPELINE_ARTIFACT_ROOT: /app/outputs
    volumes:
      - "./precision_oncology_json_pipeline:/app"
      - "./data/artifacts:/app/outputs"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8094/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 20

  dynamic-pathway-analyzer:
    build:
      context: .
      dockerfile: docker/dynamic-pathway-analyzer.Dockerfile
    environment:
      OPENAI_API_KEY: ${DOWNSTREAM_OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      OPENAI_NORMALIZER_MODEL: ${OPENAI_NORMALIZER_MODEL:-gpt-5.6}
      MAX_JSON_CHARS: ${MAX_JSON_CHARS:-180000}
      MAX_FINDINGS: ${MAX_FINDINGS:-40}
      MAX_SOURCE_RECORDS: ${MAX_SOURCE_RECORDS:-40}
      MAX_RESEARCH_PATHWAYS: ${MAX_RESEARCH_PATHWAYS:-5}
      DYNAMIC_PATHWAY_UID: ${DYNAMIC_PATHWAY_UID:-1000}
      DYNAMIC_PATHWAY_GID: ${DYNAMIC_PATHWAY_GID:-1000}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      PIPELINE_ARTIFACT_ROOT: /app/outputs
    volumes:
      - "./dynamic_pathway_analyzer:/app"
      - "./data/artifacts:/app/outputs"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  postgres-data:
  opensearch-data:
