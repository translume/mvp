x-runtime: &runtime
  init: true
  restart: unless-stopped

x-common-environment: &common-environment
  TRANSLUME_ENV: production
  TRANSLUME_ENFORCE_PRIME_DIRECTIVES: "true"
  TRANSLUME_MODEL_PROVIDER: openai
  TRANSLUME_ALLOW_LOCAL_INFERENCE: "false"
  TRANSLUME_REQUIRE_MIMS: "true"
  TRANSLUME_REQUIRE_DOCLING: "true"
  TRANSLUME_REQUIRE_OPENSEARCH: "true"
  TRANSLUME_REQUIRE_POSTGRES: "true"
  TRANSLUME_RETRIEVAL_MODE: lexical
  TRANSLUME_STORAGE_ROOT: /data/uploads
  TRANSLUME_AUDIT_ROOT: /data/audit
  TRANSLUME_PROMPTS_ROOT: /app/configs/prompts
  POSTGRES_DSN: postgresql://translume:translume@postgres:5432/translume
  OPENSEARCH_URL: http://opensearch:9200
  DOCLING_SERVICE_URL: http://docling-service:8090
  DOCLING_EXTRACTION_METHOD: openai
  DOCLING_TIMEOUT_SECONDS: ${DOCLING_TIMEOUT_SECONDS:-7200}
  OPTIMUSKG_SERVICE_URL: http://optimuskg-service:8091
  OPTIMUSKG_VENDOR_DIR: /app/third_party/upstream/OptimusKG
  OPTIMUSKG_CACHE_DIR: /data/optimuskg
  OPTIMUSKG_USE_LCC: "true"
  OPTIMUSKG_MAX_EDGES: ${OPTIMUSKG_MAX_EDGES:-500}
  TOOLUNIVERSE_SERVICE_URL: http://tooluniverse-service:8092
  TOOLUNIVERSE_VENDOR_DIR: /app/third_party/upstream/ToolUniverse
  TOOLUNIVERSE_WORKFLOW_CONFIG: /app/configs/local/tooluniverse_workflows.json
  TOOLUNIVERSE_LIGHT_IMPORT: "true"
  TOOLUNIVERSE_LAZY_LOADING: "true"
  TRANSLUME_TOOL_WORKFLOWS: literature_validation,pathway_context,target_context,variant_context,trial_context_review,therapy_context,resistance_mechanism_context,biomarker_retesting_context,guideline_context,clinical_trial_context,lineage_transformation_context,recent_therapy_agent_backfill_context
  MEDEA_SERVICE_URL: http://medea-service:8093
  MEDEA_VENDOR_DIR: /app/third_party/upstream/Medea
  MEDEADB_PATH: /data/medeadb
  MEDEA_REQUIRE_DATABASE: "true"
  MEDEA_RERANKER: openai_embeddings
  MIMS_TIMEOUT_SECONDS: ${MIMS_TIMEOUT_SECONDS:-7200}
  REACTOME_LOCAL_ENABLED: "true"
  REACTOME_GRAPHDB_IMAGE: public.ecr.aws/reactome/graphdb:Release97
  REACTOME_RELEASE: "97"
  REACTOME_NEO4J_URI: bolt://reactome-graphdb:7687
  REACTOME_NEO4J_DATABASE: graph.db
  REACTOME_NEO4J_AUTH_MODE: basic
  REACTOME_NEO4J_USER: neo4j
  REACTOME_NEO4J_PASSWORD: test
  REACTOME_QUERY_TIMEOUT_SECONDS: "30"
  REACTOME_MAX_RESULTS: "30"
  REACTOME_MAX_QUERY_TERMS: "8"
  REACTOME_REMOTE_FALLBACK: "false"
  PRECISION_ONCOLOGY_SERVICE_URL: http://precision-oncology-pipeline:8094
  DYNAMIC_PATHWAY_SERVICE_URL: http://dynamic-pathway-analyzer:8095
  TRANSLUME_DOWNSTREAM_TIMEOUT_SECONDS: ${TRANSLUME_DOWNSTREAM_TIMEOUT_SECONDS:-21600}

x-openai-environment: &openai-environment
  OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the .env file}
  OPENAI_BASE_URL: https://api.openai.com/v1
  OPENAI_REASONING_MODEL: ${OPENAI_REASONING_MODEL:-gpt-6-astra}
  OPENAI_DOCUMENT_MODEL: ${OPENAI_DOCUMENT_MODEL:-gpt-6-astra}
  OPENAI_REASONING_MODE: pro
  OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-xhigh}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
  OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
  OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-900}
  OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
  OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-32768}
  OPENAI_RETRY_MAX_OUTPUT_TOKENS: ${OPENAI_RETRY_MAX_OUTPUT_TOKENS:-65536}
  OPENAI_CONTEXT_TOKEN_BUDGET: ${OPENAI_CONTEXT_TOKEN_BUDGET:-200000}
  OPENAI_INPUT_TOKEN_BUDGET: ${OPENAI_INPUT_TOKEN_BUDGET:-100000}

services:
  postgres:
    <<: *runtime
    image: postgres:16
    environment:
      POSTGRES_DB: translume
      POSTGRES_USER: translume
      POSTGRES_PASSWORD: translume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translume -d translume"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  opensearch:
    <<: *runtime
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      node.store.allow_mmap: "false"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 40
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  data-init:
    init: true
    build:
      context: .
      dockerfile: docker/setup.Dockerfile
    environment: *common-environment
    volumes:
      - medea-data:/data/medeadb
      - optimuskg-data:/data/optimuskg
      - upload-data:/data/uploads
      - audit-data:/data/audit
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: "no"

  reactome-graphdb:
    <<: *runtime
    image: public.ecr.aws/reactome/graphdb:Release97
    platform: linux/amd64
    environment:
      NEO4J_dbms_memory_heap_initial__size: 1g
      NEO4J_dbms_memory_heap_max__size: ${REACTOME_HEAP_SIZE:-2g}
      NEO4J_dbms_memory_pagecache_size: ${REACTOME_PAGECACHE_SIZE:-1g}

  docling-service:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/docling.Dockerfile
    environment:
      <<: [*common-environment, *openai-environment]
      OPENAI_AUDIT_PATH: /data/audit/openai-document.jsonl
    volumes:
      - audit-data:/data/audit
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=10).read()"]
      interval: 20s
      timeout: 15s
      retries: 20

  optimuskg-service:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/optimuskg-service.Dockerfile
    environment: *common-environment
    volumes:
      - optimuskg-data:/data/optimuskg
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=10).read()"]
      interval: 20s
      timeout: 15s
      retries: 20

  tooluniverse-service:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/tooluniverse-service.Dockerfile
    environment: *common-environment
    depends_on:
      reactome-graphdb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health', timeout=20).read()"]
      interval: 30s
      timeout: 25s
      retries: 120
      start_period: 300s

  medea-service:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/medea-service.Dockerfile
    environment:
      <<: [*common-environment, *openai-environment]
      OPENAI_AUDIT_PATH: /data/audit/openai-medea.jsonl
    volumes:
      - medea-data:/data/medeadb:ro
      - audit-data:/data/audit
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8093/runtime-contract', timeout=30).read()"]
      interval: 30s
      timeout: 35s
      retries: 30
      start_period: 60s

  translume-api:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: [*common-environment, *openai-environment]
      OPENAI_AUDIT_PATH: /data/audit/openai-api.jsonl
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - upload-data:/data/uploads
      - audit-data:/data/audit
    depends_on:
      data-init:
        condition: service_completed_successfully
      docling-service:
        condition: service_healthy
      optimuskg-service:
        condition: service_healthy
      tooluniverse-service:
        condition: service_healthy
      medea-service:
        condition: service_healthy
      precision-oncology-pipeline:
        condition: service_healthy
      dynamic-pathway-analyzer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=10).read()"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 120s

  translume-ui:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      TRANSLUME_API_BASE_URL: http://translume-api:8080
      TRANSLUME_UI_HOST: 0.0.0.0
      TRANSLUME_UI_PORT: "7860"
      TRANSLUME_UI_API_TIMEOUT_SECONDS: "120"
      TRANSLUME_UI_PROCESS_TIMEOUT_SECONDS: ${TRANSLUME_UI_PROCESS_TIMEOUT_SECONDS:-21600}
      TRANSLUME_UI_DOWNSTREAM_TIMEOUT_SECONDS: ${TRANSLUME_UI_DOWNSTREAM_TIMEOUT_SECONDS:-21600}
    ports:
      - "127.0.0.1:7860:7860"
    depends_on:
      translume-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860', timeout=10).read()"]
      interval: 20s
      timeout: 15s
      retries: 20

  translume-worker:
    <<: *runtime
    profiles: ["worker"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment: *common-environment
    depends_on:
      data-init:
        condition: service_completed_successfully

  precision-oncology-pipeline:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/precision-oncology-pipeline.Dockerfile
    environment:
      <<: *openai-environment
      OPENAI_MODEL: ${OPENAI_REASONING_MODEL:-gpt-6-astra}
      PRECISION_ONCOLOGY_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-900}
      PRECISION_ONCOLOGY_RUN_TIMEOUT_SECONDS: "10800"
      PRECISION_ONCOLOGY_UID: ${PRECISION_ONCOLOGY_UID:-1000}
      PRECISION_ONCOLOGY_GID: ${PRECISION_ONCOLOGY_GID:-1000}
      PIPELINE_ARTIFACT_ROOT: /app/outputs
    volumes:
      - ./data/artifacts:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8094/health', timeout=10).read()"]
      interval: 20s
      timeout: 15s
      retries: 20

  dynamic-pathway-analyzer:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/dynamic-pathway-analyzer.Dockerfile
    environment:
      <<: *openai-environment
      OPENAI_MODEL: ${OPENAI_REASONING_MODEL:-gpt-6-astra}
      OPENAI_NORMALIZER_MODEL: ${OPENAI_REASONING_MODEL:-gpt-6-astra}
      MAX_JSON_CHARS: ${MAX_JSON_CHARS:-180000}
      MAX_FINDINGS: ${MAX_FINDINGS:-80}
      MAX_SOURCE_RECORDS: ${MAX_SOURCE_RECORDS:-40}
      MAX_RESEARCH_PATHWAYS: ${MAX_RESEARCH_PATHWAYS:-10}
      DYNAMIC_PATHWAY_RUN_TIMEOUT_SECONDS: "7200"
      DYNAMIC_PATHWAY_UID: ${DYNAMIC_PATHWAY_UID:-1000}
      DYNAMIC_PATHWAY_GID: ${DYNAMIC_PATHWAY_GID:-1000}
      PIPELINE_ARTIFACT_ROOT: /app/outputs
    volumes:
      - ./data/artifacts:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health', timeout=10).read()"]
      interval: 20s
      timeout: 15s
      retries: 20

  verify:
    profiles: ["verification"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: [*common-environment, *openai-environment]
      TRANSLUME_E2E_REPORT_PATH: /inputs/report.pdf
      TRANSLUME_E2E_REPORT_TYPE: ${TRANSLUME_E2E_REPORT_TYPE:-NGS}
      TRANSLUME_E2E_DIAGNOSIS: ${TRANSLUME_E2E_DIAGNOSIS:-}
      TRANSLUME_API_URL: http://translume-api:8080
      DOCLING_PUBLIC_URL: http://docling-service:8090
      OPTIMUSKG_PUBLIC_URL: http://optimuskg-service:8091
      TOOLUNIVERSE_PUBLIC_URL: http://tooluniverse-service:8092
      MEDEA_PUBLIC_URL: http://medea-service:8093
      OPENSEARCH_PUBLIC_URL: http://opensearch:9200
      POSTGRES_PUBLIC_DSN: postgresql://translume:translume@postgres:5432/translume
      OPENAI_AUDIT_PATH: /data/audit/openai-verification.jsonl
    volumes:
      - ./data/input:/inputs:ro
      - ./data/artifacts:/app/data/artifacts
      - medea-data:/data/medeadb:ro
      - optimuskg-data:/data/optimuskg:ro
      - audit-data:/data/audit
    command: ["python", "scripts/run_full_stack_integration.py", "--api-timeout-seconds", "21600"]
    depends_on:
      translume-api:
        condition: service_healthy

volumes:
  postgres-data:
  opensearch-data:
  medea-data:
  optimuskg-data:
  upload-data:
  audit-data:
